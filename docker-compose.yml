version: '3.8'

services:
  # ----------------------------------------------------
  # 1. BACKEND NESTJS
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gastrosuite_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      # La demo publicada usa su propia BD (gastrosuite_demo); desarrollo usa gastrosuite_db desde backend/.env
      DATABASE_URL: mysql://gastro_admin:lucas06122012@129.121.36.186:3306/gastrosuite_demo
      JWT_SECRET: super_secret_jwt_key_gastrosuite_2026
      # URL pública de la Vitrina (retorno de Webpay)
      VITRINA_URL: http://129.121.36.186:8891
    ports:
      - "3890:3000"
    networks:
      - gastrosuite_net

  # ----------------------------------------------------
  # 2. FRONTEND ANGULAR + NGINX
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gastrosuite_frontend
    restart: always
    ports:
      - "8890:80"
    depends_on:
      - backend
    networks:
      - gastrosuite_net

  # ----------------------------------------------------
  # 3. VITRINA ONLINE (ANGULAR SSR) - cliente final
  # ----------------------------------------------------
  vitrina:
    build:
      context: ./vitrina
      dockerfile: Dockerfile
    container_name: gastrosuite_vitrina
    restart: always
    environment:
      API_URL: http://backend:3000
    ports:
      - "8891:4000"
    depends_on:
      - backend
    networks:
      - gastrosuite_net

networks:
  gastrosuite_net:
    driver: bridge
