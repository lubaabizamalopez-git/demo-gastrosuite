version: '3.8'

services:
  # ----------------------------------------------------
  # 1. BACKEND NESTJS
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gastrosuite_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-mysql://gastro_admin:lucas06122012@129.121.36.186:3306/gastrosuite_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_gastrosuite_2026}
    ports:
      - "3005:3000"
    networks:
      - gastrosuite_net

  # ----------------------------------------------------
  # 2. FRONTEND ANGULAR + NGINX
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gastrosuite_frontend
    restart: always
    ports:
      - "8085:80"
    depends_on:
      - backend
    networks:
      - gastrosuite_net

networks:
  gastrosuite_net:
    driver: bridge
