<div class="flex flex-col w-full gap-1.5 font-sans relative" (click)="$event.stopPropagation()">

  @if (label()) {
    <label [class]="error() ? 'text-status-error-text font-bold' : 'text-text-body font-semibold'" class="text-xs select-none">
      {{ label() }}
    </label>
  }

  <div class="relative w-full">
    <button
      type="button"
      (click)="toggleDropdown()"
      [disabled]="disabled()"
      [ngClass]="{
        'border-status-error-text bg-status-error-bg': error(),
        'border-neutral-border bg-neutral-surface': !error()
      }"
      [class]="icon() ? 'pl-10' : 'pl-4'"
      class="w-full pr-4 py-2.5 text-sm rounded-xl border border-solid text-left font-medium text-text-title outline-none transition-all duration-200 cursor-pointer flex items-center justify-between focus:ring-2 focus:ring-brand-primary/15"
    >
      @if (icon()) {
        <div [class]="error() ? 'text-status-error-text' : 'text-text-muted'" class="absolute left-3.5 flex items-center justify-center pointer-events-none">
          <i [class]="'fas ' + icon() + ' text-sm'"></i>
        </div>
      }

      <span [ngClass]="{'text-text-muted/70': selectedValue() === '' || selectedValue() === null}">{{ selectedLabel() }}</span>
      <i class="fas fa-chevron-down text-xs text-text-muted transition-transform duration-200" [class.rotate-180]="isOpen()"></i>
    </button>

    @if (isOpen()) {
      <div class="absolute left-0 right-0 mt-1.5 bg-neutral-surface border border-brand-soft/50 rounded-xl shadow-xl overflow-hidden z-40">
        @if (buscable()) {
          <div class="p-2 border-b border-neutral-border">
            <div class="relative">
              <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-xs text-text-muted"></i>
              <input
                type="text"
                [value]="busqueda()"
                (input)="busqueda.set($any($event.target).value)"
                placeholder="Buscar..."
                autocomplete="off"
                class="w-full pl-8 pr-3 py-2 text-sm rounded-lg bg-neutral-bg text-text-title outline-none focus:ring-2 focus:ring-brand-primary/15"
              />
            </div>
          </div>
        }
        <div class="max-h-60 overflow-y-auto">
          <!-- Primera opción deshabilitada, según el UI Kit -->
          <div class="px-4 py-2.5 text-sm text-text-muted bg-neutral-bg cursor-not-allowed">{{ placeholder() }}</div>
          @for (opt of opcionesFiltradas(); track opt.value) {
            <div
              (click)="selectOption(opt)"
              [ngClass]="{
                'bg-brand-cream text-brand-primary font-bold': selectedValue() === opt.value && !opt.disabled,
                'opacity-50 cursor-not-allowed bg-neutral-bg text-text-muted': opt.disabled,
                'text-text-body hover:bg-brand-primary hover:text-brand-contraste cursor-pointer': !opt.disabled
              }"
              class="px-4 py-2.5 text-sm transition-colors duration-150 font-medium"
            >
              {{ opt.label }}
            </div>
          } @empty {
            <div class="px-4 py-3 text-sm text-text-muted">Sin resultados</div>
          }
        </div>
      </div>
    }
  </div>

  @if (error()) {
    <span class="text-[11px] text-status-error-text font-semibold flex items-center gap-1 mt-0.5">
      <i class="fas fa-exclamation-circle text-xs"></i>
      {{ error() }}
    </span>
  }
</div>
