<div class="h-full bg-neutral-bg flex flex-col relative overflow-hidden">
  
  <!-- CABECERA: Navegación por Zonas (Pill Tabs Premium) -->
  <header class="w-full bg-neutral-surface border-b border-neutral-border py-4 px-6 flex flex-col items-center gap-4 z-10 shadow-sm relative">
    
    <div class="w-full flex justify-between items-center mb-2">
      <h1 class="text-xl font-bold text-text-title tracking-tight">
        Gestión de Zonas y Mesas
      </h1>
      
      <div class="flex gap-2">
        <button (click)="abrirModalArea()" class="px-4 py-2 bg-neutral-bg border border-brand-primary text-brand-primary hover:bg-brand-soft text-sm font-bold rounded-lg shadow-sm transition-all flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Nueva Zona
        </button>
        <button *ngIf="areaActivaId()" (click)="abrirModalMesa()" class="px-4 py-2 bg-brand-primary hover:bg-brand-dark text-white text-sm font-bold rounded-lg shadow-md transition-all flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Añadir Mesa
        </button>
      </div>
    </div>

    <!-- TABS PREMIUM DE ZONA -->
    <div class="flex items-center justify-center p-2 bg-neutral-surface border border-neutral-border rounded-full shadow-sm max-w-max mx-auto font-sans">
      <div class="flex space-x-1">
        <button 
              *ngFor="let zona of areas()" 
              (click)="cambiarArea(zona.ids)"
              [ngClass]="{
                'bg-brand-soft text-brand-primary border-brand-soft shadow-sm': areaActivaId() === zona.ids,
                'bg-transparent text-text-muted hover:text-text-title border-transparent': areaActivaId() !== zona.ids
              }"
              class="flex items-center space-x-2 px-6 py-2.5 text-sm font-medium rounded-full border transition-all duration-300 ease-in-out focus:outline-none cursor-pointer group">
          <i class="fas" [ngClass]="getIcono(zona.nombre)"></i>
          <span>{{ zona.nombre }}</span>
          
          <!-- Botones de edición de área, solo visibles en la zona activa o al hacer hover -->
          <div *ngIf="areaActivaId() === zona.ids" class="flex ml-2 gap-1 opacity-60 hover:opacity-100 transition-opacity">
            <i class="fas fa-edit cursor-pointer hover:text-brand-dark" (click)="editarArea(zona); $event.stopPropagation()" title="Editar Zona"></i>
            <i class="fas fa-trash cursor-pointer hover:text-error" (click)="eliminarArea(zona); $event.stopPropagation()" title="Eliminar Zona"></i>
          </div>
        </button>
      </div>
    </div>
  </header>

  <!-- PANEL CENTRAL: Mapa de Mesas -->
  <main class="flex-1 flex flex-col bg-neutral-bg relative overflow-hidden">
    <!-- Canvas de Mesas con Drag&Drop -->
    <div class="flex-1 overflow-auto bg-neutral-bg relative" 
         (dragover)="onDragOver($event)" 
         (drop)="onDrop($event)">
      
      <!-- Contenedor del plano (tamaño fijo amplio o ajustado) -->
      <div *ngIf="areaActivaId() && mesasArea().length > 0" class="min-w-[1200px] min-h-[800px] w-full h-full relative p-4">
        
        <!-- Tarjeta de Mesa -->
        <div *ngFor="let mesa of mesasArea()" 
             draggable="true"
             (dragstart)="onDragStart(mesa, $event)"
             class="absolute group bg-neutral-surface border-2 rounded-2xl p-4 flex flex-col items-center justify-center cursor-move transition-all duration-300 hover:shadow-xl w-40"
             [style.left.px]="mesa.posX || 0"
             [style.top.px]="mesa.posY || 0"
             [ngClass]="{
               'border-success/30 hover:border-success': mesa.estado === 'LIBRE',
               'border-error/30 hover:border-error': mesa.estado === 'OCUPADA',
               'border-warning/30 hover:border-warning': mesa.estado === 'RESERVADA'
             }">
          
          <!-- Indicador de Estado -->
          <div class="absolute top-3 right-3 w-3 h-3 rounded-full shadow-sm animate-pulse"
               [ngClass]="{
                 'bg-success': mesa.estado === 'LIBRE',
                 'bg-error': mesa.estado === 'OCUPADA',
                 'bg-warning': mesa.estado === 'RESERVADA'
               }"></div>

          <!-- Icono de Mesa -->
          <div class="w-16 h-16 rounded-full bg-neutral-bg flex items-center justify-center mb-3 text-text-muted group-hover:scale-110 transition-transform duration-300">
             <i class="fas fa-chair text-2xl"
                  [ngClass]="{
                    'text-success': mesa.estado === 'LIBRE',
                    'text-error': mesa.estado === 'OCUPADA',
                    'text-warning': mesa.estado === 'RESERVADA'
                  }"></i>
          </div>
          
          <!-- Info de Mesa -->
          <h3 class="text-xl font-black text-text-title tracking-tight mb-1 pointer-events-none">{{ mesa.numeroMesa }}</h3>
          <p class="text-xs font-semibold text-text-muted flex items-center gap-1 pointer-events-none">
            <i class="fas fa-users"></i>
            {{ mesa.capacidad }} Personas
          </p>

          <!-- Hover Actions -->
          <div class="absolute inset-x-0 bottom-0 p-3 flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity bg-gradient-to-t from-neutral-surface via-neutral-surface to-transparent rounded-b-2xl">
             <button (click)="editarMesa(mesa, $event)" class="p-2 bg-neutral-bg text-text-body hover:text-brand-primary rounded-full shadow hover:bg-white transition-colors cursor-pointer">
               <i class="fas fa-edit"></i>
             </button>
             <button (click)="eliminarMesa(mesa, $event)" class="p-2 bg-neutral-bg text-text-body hover:text-error rounded-full shadow hover:bg-white transition-colors cursor-pointer">
               <i class="fas fa-trash"></i>
             </button>
          </div>
        </div>

      </div>

      <!-- Estado Vacío -->
      <div *ngIf="areaActivaId() && mesasArea().length === 0" class="h-full min-h-[400px] flex flex-col items-center justify-center text-text-muted">
        <i class="fas fa-th-large text-5xl mb-4 opacity-20"></i>
        <h3 class="text-xl font-bold text-text-body mb-2">No hay mesas en esta área</h3>
        <p class="text-sm">Haz clic en "Añadir Mesa" para crear la primera.</p>
      </div>
      
      <!-- Ningun area seleccionada -->
      <div *ngIf="areas().length === 0" class="h-full min-h-[400px] flex flex-col items-center justify-center text-text-muted">
        <i class="fas fa-map-marked-alt text-6xl mb-4 opacity-10"></i>
        <p class="text-lg font-medium text-text-body">Aún no hay zonas creadas.</p>
        <p class="text-sm">Crea tu primera zona para empezar a mapear tu restaurante.</p>
      </div>
    </div>
  </main>
</div>

<!-- MODALES -->
<app-modal-area 
  *ngIf="mostrarModalArea" 
  [area]="areaEnEdicion" 
  (cerrar)="cerrarModalArea($event)">
</app-modal-area>

<app-modal-mesa 
  *ngIf="mostrarModalMesa" 
  [mesa]="mesaEnEdicion" 
  [areaId]="areaActiva()?.id"
  (cerrar)="cerrarModalMesa($event)">
</app-modal-mesa>
