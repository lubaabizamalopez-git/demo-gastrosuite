<div class="h-full flex flex-col gap-6 overflow-hidden pr-2">
  <!-- Header Híbrido Optimizado -->
  <div class="w-full flex flex-col md:flex-row md:items-center md:justify-between border-b border-neutral-border pb-4 font-sans">
    
    <!-- Título y Subtítulo de la Vista (Previene colisiones) -->
    <div class="mb-4 md:mb-0">
      <h1 class="text-xl md:text-2xl font-bold text-text-title tracking-tight">Salón y Mesas</h1>
      <p class="text-xs md:text-sm text-text-muted mt-0.5">Supervise la distribución y estado de las mesas en tiempo real.</p>
    </div>

    <!-- ==========================================
         SELECTOR CONTENEDOR DE PESTAÑAS (TABS)
         ========================================== -->
    <div class="relative max-w-full md:max-w-xl lg:max-w-2xl">
      
      <!-- VISTA MÓVIL: Dropdown elegante (Se muestra solo en pantallas < md) -->
      <div class="block md:hidden w-full">
        <select 
          [value]="zonaActivaId()" 
          (change)="cambiarZona(+$any($event.target).value)"
          class="w-full bg-neutral-surface border border-neutral-border text-text-title px-4 py-3 text-sm rounded-xl focus:outline-none font-medium shadow-sm transition-all focus:border-brand-primary">
          <option *ngFor="let zona of zonas()" [value]="zona.ids">{{ zona.nombre }}</option>
        </select>
      </div>

      <!-- VISTA ESCRITORIO: Scroll Horizontal Suave con Desvanecimiento (Se muestra de md en adelante) -->
      <div class="hidden md:flex items-center bg-neutral-surface border border-neutral-border p-1.5 rounded-full shadow-sm overflow-x-auto no-scrollbar scroll-smooth whitespace-nowrap max-w-full">
        <div class="flex space-x-1">
          
          <!-- Iteración de Botones con Contraste Mejorado -->
          <button 
            *ngFor="let zona of zonas()" 
            (click)="cambiarZona(zona.ids)"
            [ngClass]="{
              'bg-brand-soft/60 text-brand-dark border-brand-soft shadow-xs font-semibold': zonaActivaId() === zona.ids,
              'bg-transparent text-text-muted hover:text-text-title border-transparent hover:bg-neutral-bg': zonaActivaId() !== zona.ids
            }"
            class="flex items-center space-x-2 px-5 py-2 text-xs lg:text-sm font-medium rounded-full border transition-all duration-200 ease-in-out focus:outline-none cursor-pointer">
            
            <!-- Icono Dinámico FontAwesome -->
            <i class="fas text-xs" [ngClass]="getIcono(zona.nombre)"></i>
            
            <span>{{ zona.nombre }}</span>
          </button>
        </div>
      </div>
      
    </div>
  </div>

  <!-- Legend -->
  <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm flex items-center justify-between">
    <div class="flex gap-6">
      <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-gray-200"></div><span class="text-sm font-medium text-gray-600">Disponible</span></div>
      <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-brand-orange"></div><span class="text-sm font-medium text-gray-600">Ocupada</span></div>
      <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-blue-500"></div><span class="text-sm font-medium text-gray-600">Reservada</span></div>
      <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-yellow-500"></div><span class="text-sm font-medium text-gray-600">Limpiando</span></div>
    </div>
    <div class="text-sm font-bold text-gray-900">12/30 Ocupadas</div>
  </div>

  <!-- Tables Grid -->
  <div class="flex-1 bg-white border border-gray-100 rounded-2xl shadow-sm p-8 overflow-y-auto relative bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHBhdGggZD0iTTAgMGg0MHY0MEgweiIgZmlsbD0ibm9uZSIvPjxwYXRoIGQ9Ik0wIDB2NDBMMTAgMzBsMTAgMTBMMzAgMzBsMTAgMTBWMHoiIGZpbGw9InJnYmEoMCwwLDAsMC4wMikiLz48L3N2Zz4=')]">
    
    <div class="grid grid-cols-5 gap-8 max-w-5xl mx-auto">
      
      <!-- Table Available -->
      <div class="aspect-square bg-gray-50 border-2 border-gray-200 rounded-full flex flex-col items-center justify-center cursor-pointer hover:border-brand-orange hover:bg-orange-50 transition-all group shadow-sm">
        <span class="text-xl font-bold text-gray-400 group-hover:text-brand-orange">M1</span>
        <span class="text-xs font-medium text-gray-400 mt-1">4 pax</span>
      </div>

      <!-- Table Occupied -->
      <div class="aspect-square bg-brand-orange border-2 border-brand-orange rounded-full flex flex-col items-center justify-center cursor-pointer shadow-md hover:scale-105 transition-transform relative">
        <span class="text-xl font-bold text-white">M2</span>
        <span class="text-xs font-medium text-white/80 mt-1">45 min</span>
        <div class="absolute -top-2 -right-2 bg-white text-gray-900 text-xs font-bold px-2 py-1 rounded-full shadow-sm border border-gray-100">$84</div>
      </div>

      <!-- Table Reserved -->
      <div class="aspect-square bg-blue-500 border-2 border-blue-500 rounded-full flex flex-col items-center justify-center cursor-pointer shadow-md hover:scale-105 transition-transform">
        <span class="text-xl font-bold text-white">M3</span>
        <span class="text-xs font-medium text-white/80 mt-1">19:30</span>
      </div>

      <!-- Table Available -->
      <div class="aspect-square bg-gray-50 border-2 border-gray-200 rounded-full flex flex-col items-center justify-center cursor-pointer hover:border-brand-orange hover:bg-orange-50 transition-all group shadow-sm">
        <span class="text-xl font-bold text-gray-400 group-hover:text-brand-orange">M4</span>
        <span class="text-xs font-medium text-gray-400 mt-1">2 pax</span>
      </div>

      <!-- Table Cleaning -->
      <div class="aspect-square bg-yellow-500 border-2 border-yellow-500 rounded-full flex flex-col items-center justify-center cursor-pointer shadow-md hover:scale-105 transition-transform">
        <span class="text-xl font-bold text-white">M5</span>
        <svg class="w-5 h-5 text-white mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
      </div>
      
      <!-- Big Table Available -->
      <div class="col-span-2 aspect-[2/1] bg-gray-50 border-2 border-gray-200 rounded-[3rem] flex flex-col items-center justify-center cursor-pointer hover:border-brand-orange hover:bg-orange-50 transition-all group shadow-sm">
        <span class="text-xl font-bold text-gray-400 group-hover:text-brand-orange">M6 (VIP)</span>
        <span class="text-xs font-medium text-gray-400 mt-1">8 pax</span>
      </div>

      <!-- Big Table Occupied -->
      <div class="col-span-2 aspect-[2/1] bg-brand-orange border-2 border-brand-orange rounded-[3rem] flex flex-col items-center justify-center cursor-pointer shadow-md hover:scale-105 transition-transform relative">
        <span class="text-xl font-bold text-white">M7 (Familiar)</span>
        <span class="text-xs font-medium text-white/80 mt-1">1h 15min</span>
        <div class="absolute -top-2 -right-2 bg-white text-gray-900 text-xs font-bold px-2 py-1 rounded-full shadow-sm border border-gray-100">$215</div>
      </div>
      
      <!-- Table Available -->
      <div class="aspect-square bg-gray-50 border-2 border-gray-200 rounded-full flex flex-col items-center justify-center cursor-pointer hover:border-brand-orange hover:bg-orange-50 transition-all group shadow-sm">
        <span class="text-xl font-bold text-gray-400 group-hover:text-brand-orange">M8</span>
        <span class="text-xs font-medium text-gray-400 mt-1">2 pax</span>
      </div>

    </div>
  </div>
</div>
