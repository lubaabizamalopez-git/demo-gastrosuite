<div class="h-full flex flex-col gap-6 overflow-hidden pr-2">
  <div class="flex justify-between items-end">
    <div>
      <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Configuración</h1>
      <p class="text-gray-500 mt-1">Ajustes generales, métodos de pago, impuestos y preferencias del sistema.</p>
    </div>
    
    <div class="flex gap-3">
      <button class="bg-brand-orange text-white px-4 py-2 rounded-lg text-sm font-medium shadow-md hover:bg-orange-600 transition-colors flex items-center">
        Guardar Cambios
      </button>
    </div>
  </div>

  <div class="flex-1 flex gap-8 overflow-hidden">
    <!-- Sidebar Navigation for Settings -->
    <div class="w-64 flex flex-col gap-2">
      <button class="text-left px-4 py-3 rounded-xl text-sm font-bold bg-white text-brand-orange shadow-sm border border-gray-100 flex items-center">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
        Restaurante
      </button>
      <button class="text-left px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-white/50 transition-colors flex items-center">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        Facturación e Impuestos
      </button>
      <button class="text-left px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-white/50 transition-colors flex items-center">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
        Métodos de Pago
      </button>
      <button class="text-left px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-white/50 transition-colors flex items-center">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        Notificaciones
      </button>
    </div>

    <!-- Main Settings Area -->
    <div class="flex-1 bg-white border border-gray-100 rounded-2xl shadow-sm overflow-y-auto custom-scrollbar p-8">
      
      <div class="max-w-2xl">
        <h2 class="text-xl font-bold text-gray-900 mb-6">Información del Restaurante</h2>
        
        <div class="space-y-6">
          <div class="flex items-center gap-6">
            <div class="w-24 h-24 bg-gray-100 rounded-2xl border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-400 hover:border-brand-orange hover:text-brand-orange transition-colors cursor-pointer">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            </div>
            <div>
              <p class="font-bold text-gray-900">Logo del Restaurante</p>
              <p class="text-sm text-gray-500 mb-2">Recomendado: 512x512px, formato PNG.</p>
              <button class="px-3 py-1.5 border border-gray-200 rounded-lg text-xs font-medium text-gray-700 hover:bg-gray-50">Subir nueva imagen</button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Nombre Comercial</label>
              <input type="text" value="Gastro Dine-In" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange text-sm">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Razón Social</label>
              <input type="text" value="Gastrosuite SpA" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange text-sm">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Teléfono Principal</label>
              <input type="text" value="+56 2 2345 6789" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange text-sm">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Correo Electróúnico</label>
              <input type="email" value="contacto&#64;gastrodinein.com" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange text-sm">
            </div>
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Dirección Completa</label>
            <input type="text" value="Av. Providencia 1234, Local 5, Santiago" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange text-sm">
          </div>

          <div class="pt-6 border-t border-gray-100">
            <h3 class="font-bold text-gray-900 mb-4">Configuración Regional</h3>
            
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Moneda Base</label>
                <select class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange text-sm">
                  <option>Peso Chileno (CLP - $)</option>
                  <option>Dólar Estadounidense (USD - $)</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Zona Horaria</label>
                <select class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/20 focus:border-brand-orange text-sm">
                  <option>America/Santiago (GMT-4)</option>
                  <option>America/Buenos_Aires (GMT-3)</option>
                </select>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
