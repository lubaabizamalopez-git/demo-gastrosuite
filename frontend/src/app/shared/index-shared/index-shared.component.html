<div class="p-8 max-w-7xl mx-auto flex flex-col gap-12 bg-[#FAF7F2] min-h-screen">
  
  <app-view-header title="Kit de Diseño - Gastrosuite V2" subtitle="Previsualización de componentes compartidos"></app-view-header>

  <div class="flex flex-col gap-4 p-6 bg-[#231E1B] rounded-2xl border border-[#FFBD80]/20 mb-8">
    <h2 class="text-white text-lg font-bold">Logo SVG Generado</h2>
    <div class="flex items-center gap-6">
      <!-- Solo gorro -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16">
        <path d="M6 16.5C3 16.5 2 13 4.5 11C4 7 7 4 12 4C17 4 20 7 19.5 11C22 13 21 16.5 18 16.5" />
        <rect x="6" y="16.5" width="12" height="4.5" rx="1.5" />
        <line x1="6" y1="16.5" x2="18" y2="16.5" />
      </svg>
      
      <!-- Gorro + Texto -->
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-12 h-12">
          <path d="M6 16.5C3 16.5 2 13 4.5 11C4 7 7 4 12 4C17 4 20 7 19.5 11C22 13 21 16.5 18 16.5" />
          <rect x="6" y="16.5" width="12" height="4.5" rx="1.5" />
          <line x1="6" y1="16.5" x2="18" y2="16.5" />
        </svg>
        <span class="text-white font-sans text-3xl font-extrabold tracking-tight">
          Gastro<span class="text-[#FF6B00]">Suite</span>
        </span>
      </div>
    </div>
  </div>


  <div class="flex flex-col gap-6">
    <app-section-header title="1. Botones (Buttons)" description="Diferentes tamaños y variantes de color"></app-section-header>
    <div class="flex flex-wrap gap-4 items-center p-6 bg-white rounded-2xl shadow-sm border border-[#FFBD80]/30">
      <app-button label="Primario" color="primary" icon="fa-check"></app-button>
      <app-button label="Success" color="success" icon="fa-save"></app-button>
      <app-button label="Muted" color="muted" icon="fa-eye"></app-button>
      <app-button label="Danger" color="danger" icon="fa-trash"></app-button>
      <app-button label="Pequeño" size="sm"></app-button>
      <app-button label="Grande" size="lg"></app-button>
      <app-button label="Deshabilitado" [disabled]="true"></app-button>
    </div>
  </div>

  <div class="flex flex-col gap-6">
    <app-section-header title="2. Badges (Etiquetas)" description="Indicadores de estado genéricos y estados de pedidos"></app-section-header>
    
    <div class="flex flex-col gap-3">
      <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Estados Genéricos</span>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-2xl shadow-sm border border-[#FFBD80]/30">
        <app-badge label="Completado" status="success" icon="fa-check-circle"></app-badge>
        <app-badge label="Pendiente" status="warning" icon="fa-clock"></app-badge>
        <app-badge label="Información" status="info" icon="fa-info-circle"></app-badge>
        <app-badge label="Cancelado" status="danger" icon="fa-times-circle"></app-badge>
        <app-badge label="Destacado" status="brand" icon="fa-star"></app-badge>
        <app-badge label="Borrador" status="muted" shape="redonda"></app-badge>
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Estados de Pedidos (Matriz Hexadecimal)</span>
      <div class="flex flex-wrap items-center gap-4 p-6 bg-white rounded-2xl shadow-sm border border-[#FFBD80]/30">
        <app-badge label="Ingresado" status="INGRESADO"></app-badge>
        <app-badge label="En Cocina" status="EN_COCINA"></app-badge>
        <app-badge label="Listo Mesa" status="LISTO_MESA"></app-badge>
        <app-badge label="Listo Retiro" status="LISTO_RETIRO"></app-badge>
        <app-badge label="Listo Envío" status="LISTO_ENVIO"></app-badge>
        <app-badge label="Servido" status="SERVIDO"></app-badge>
        <app-badge label="En Camino" status="EN_CAMINO"></app-badge>
        <app-badge label="Entregado" status="ENTREGADO"></app-badge>
        <app-badge label="Pagado y Cerrado" status="PAGADO_CERRADO"></app-badge>
        <app-badge label="Cancelado" status="CANCELADO"></app-badge>
        <app-badge label="Retrasado" status="RETRASADO"></app-badge>
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-6">
    <app-section-header title="3. Selectores (Custom Select)" description="Dropdowns personalizados reactivos"></app-section-header>
    <div class="w-full max-w-sm p-6 bg-white rounded-2xl shadow-sm border border-[#FFBD80]/30">
      <app-custom-select label="Selecciona Mesa" icon="fa-chair" [options]="mockOptions"></app-custom-select>
    </div>
  </div>

  <div class="flex flex-col gap-6">
    <app-section-header title="4. Tarjetas KPI" description="Indicadores clave de rendimiento"></app-section-header>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <app-kpi-card label="Ventas Hoy" value="$12,540" icon="fa-chart-line" type="brand"></app-kpi-card>
      <app-kpi-card label="Tickets Abiertos" value="45" icon="fa-receipt" type="warning"></app-kpi-card>
      <app-kpi-card label="Completados" value="128" icon="fa-check-double" type="success"></app-kpi-card>
      <app-kpi-card label="Anulaciones" value="3" icon="fa-times" type="danger"></app-kpi-card>
    </div>
  </div>

  <div class="flex flex-col gap-6">
    <app-section-header title="5. Buscador y Filtros" description="Componentes para refinamiento de listas"></app-section-header>
    <app-search-bar placeholder="Buscar pedidos..."></app-search-bar>
    <app-button label="Abrir Cajón de Filtros (Drawer)" (btnClick)="isDrawerOpen = true"></app-button>
  </div>

  <div class="flex flex-col gap-6">
    <app-section-header title="6. Switches e Interruptores" description="Controles de configuración"></app-section-header>
    <div class="flex justify-center">
      <gs-switch-kit></gs-switch-kit>
    </div>
  </div>

  <div class="flex flex-col gap-6">
    <app-section-header title="7. Alertas (Bootstrap Replicas)" description="Alertas contextuales"></app-section-header>
    <div class="flex justify-center">
      <gs-bootstrap-alerts></gs-bootstrap-alerts>
    </div>
  </div>

  <div class="flex flex-col gap-6">
    <app-section-header title="8. Spinners y Modales" description="Indicadores de carga y alertas emergentes"></app-section-header>
    <div class="flex gap-12 items-center p-6 bg-white rounded-2xl shadow-sm border border-[#FFBD80]/30">
      <gs-gourmet-spinner message="Preparando..."></gs-gourmet-spinner>
      <gs-gourmet-spinner variant="campana" message="Servido"></gs-gourmet-spinner>
      <app-button label="Mostrar Modal de Éxito" (btnClick)="isModalOpen = true"></app-button>
    </div>
  </div>

</div>

<!-- Overlays -->
<app-filter-drawer [isOpen]="isDrawerOpen" (close)="isDrawerOpen = false"></app-filter-drawer>

@if (isModalOpen) {
  <app-alert-modal 
    title="¡Operación Exitosa!" 
    message="Los componentes se han cargado correctamente." 
    type="success" 
    iconLetter="✓"
    (confirm)="isModalOpen = false">
  </app-alert-modal>
}
