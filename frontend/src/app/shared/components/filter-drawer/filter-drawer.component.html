@if (isOpen()) {
  <!-- Backdrop transl�cido de fondo (Click fuera cierra el panel) -->
  <div 
    class="fixed inset-0 z-[9999] bg-[#231E1B]/30 backdrop-blur-sm transition-opacity duration-300"
    (click)="onClose()"
  >
    <!-- Contenedor Lateral Deslizable (Detiene la propagaci�n de clicks) -->
    <div 
      class="absolute top-0 right-0 bottom-0 w-full max-w-sm bg-white border-l border-solid border-[#FFBD80]/30 shadow-2xl flex flex-col font-sans antialiased animate-slideInRight"
      (click)="$event.stopPropagation()"

    >
      
      <!-- ENCABEZADO DEL PANEL -->
      <div class="px-5 py-4 bg-[#FFF5F0] border-b border-solid border-[#91857F]/15 flex items-center justify-between select-none">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-[#FF6B00] flex items-center justify-center text-white shadow-sm shadow-[#FF6B00]/15">
            <i class="fas fa-sliders-h text-xs"></i>
          </div>
          <div>
            <h4 class="text-[#231E1B] font-bold text-sm m-0 tracking-tight">Filtros Avanzados</h4>
            <p class="text-[#5C534E] text-[11px] m-0 font-medium">Refina los listados de la pantalla</p>
          </div>
        </div>
        
        <button 
          (click)="onClose()" 
          class="w-7 h-7 rounded-full flex items-center justify-center text-[#91857F] hover:bg-[#FF6B00]/10 hover:text-[#FF6B00] transition-colors border-none bg-transparent cursor-pointer p-0"
        >
          <i class="fas fa-times text-sm"></i>
        </button>
      </div>

      <!-- CUERPO DE FILTROS (Inyecci�n din�mica mediante ng-content) -->
      <div class="p-5 flex flex-col gap-4 bg-[#FAF7F2] flex-grow overflow-y-auto">
        <ng-content select="[filter-fields]"></ng-content>
      </div>

      <!-- BOTONES DE ACCI�N INFERIORES -->
      <div class="p-4 bg-white border-t border-solid border-[#91857F]/15 flex items-center justify-between gap-3 select-none">
        <button 
          (click)="onClear()" 
          class="flex-1 bg-[#FFF5F0] hover:bg-[#FFBD80]/20 text-[#91857F] font-bold text-sm cursor-pointer py-2.5 rounded-xl border border-solid border-[#FFBD80]/30 transition-colors"
        >
          Limpiar
        </button>
        <button 
          (click)="onApply()" 
          class="flex-1 bg-[#FF6B00] hover:bg-[#CC5500] text-white font-bold text-sm cursor-pointer py-2.5 rounded-xl border-none shadow-md shadow-[#FF6B00]/15 transition-all"
        >
          Aplicar Filtros
        </button>
      </div>

    </div>
  </div>
}
