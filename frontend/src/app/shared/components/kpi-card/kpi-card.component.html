<div [class]="wrapperClasses" class="font-sans select-none">
  <!-- Contenedor del Icono/Letra con color s�lido de marca -->
  <div [class]="iconClasses">
    @if (iconLetter()) {
      <span>{{ iconLetter() }}</span>
    } @else {
      <i [class]="'fas ' + icon()"></i>
    }
  </div>
  
  <!-- Letras fluidas y org�nicas utilizando tracking-tight sutil -->
  <div class="flex flex-col">
    <span class="text-[#5C534E] font-medium text-[11px] tracking-wide uppercase opacity-80">
      {{ label() }}
    </span>
    <h3 class="text-[#231E1B] font-bold text-lg m-0 mt-0.5 tracking-tight flex items-baseline gap-1.5">
      {{ value() }}
      <ng-content select="[subtext]"></ng-content>
    </h3>
  </div>
</div>
