<header class="bg-white h-20 flex items-center justify-between px-6 border-b border-gray-100 sticky top-0 z-10 shadow-sm">
  <!-- Left Side: Menúu toggle & Search -->
  <div class="flex items-center flex-1">
    <!-- Hamburger icon for mobile (hidden on desktop maybe, but let's keep it visible per design if it's meant to collapse sidebar) -->
    <button class="text-gray-500 hover:text-gray-800 mr-6">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    
    <!-- Search Bar -->
    <div class="relative w-full max-w-lg hidden md:block group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-gray-400 group-focus-within:text-brand-orange transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
      <input type="text" class="block w-full pl-11 pr-12 py-2.5 border-0 bg-gray-50 rounded-xl leading-5 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-brand-orange focus:bg-white text-sm transition-all shadow-inner" placeholder="Search menu items, orders, customers...">
      <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
        <span class="text-gray-400 text-xs border border-gray-200 rounded px-1.5 py-0.5 bg-white shadow-sm font-mono">⌘ K</span>
      </div>
    </div>
  </div>

  <!-- Right Side: Notifications & User -->
  <div class="flex items-center space-x-6">
    <!-- Notification Bell -->
    <button class="relative p-2 text-gray-500 hover:text-gray-700 transition-colors bg-gray-50 rounded-full hover:bg-gray-100">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
      <!-- Notification Badge -->
      <span class="absolute top-0 right-0 inline-flex items-center justify-center px-1.5 py-0.5 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-red-500 rounded-full ring-2 ring-white">6</span>
    </button>

    <!-- User Profile Dropdown -->
    <div class="flex items-center cursor-pointer hover:bg-gray-50 p-1.5 rounded-lg transition-colors">
      <img class="h-10 w-10 rounded-full object-cover border-2 border-white shadow-sm" src="https://ui-avatars.com/api/?name=John+Doe&background=f3f4f6&color=374151" alt="User avatar">
      <div class="ml-3 hidden md:block text-sm">
        <p class="font-bold text-gray-800 leading-tight">John Doe</p>
        <p class="text-gray-500 text-xs mt-0.5">Administrator</p>
      </div>
    </div>
  </div>
</header>
