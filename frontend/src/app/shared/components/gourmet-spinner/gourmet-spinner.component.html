<div class="flex flex-col items-center justify-center gap-3 font-sans antialiased select-none p-4">
  
  <!-- Contenedor del Spinner Orbital -->
  <div class="relative flex items-center justify-center" [style.width.px]="size()" [style.height.px]="size()">
    
    <!-- Anillo Orbital Externo Primario (Naranja) -->
    <div class="absolute inset-0 border-4 border-solid border-transparent border-t-[#FF6B00] rounded-full animate-spin"></div>
    
    <!-- Anillo Orbital Interno Secundario (Acento Suave - Sentido Inverso) -->
    <div class="absolute w-[76%] h-[76%] border-[3px] border-solid border-transparent border-b-[#FFBD80] rounded-full animate-[spin_1.2s_linear_infinite_reverse]"></div>
    
    <!-- Iconografía Central Estática Corregida -->
    <div class="absolute flex items-center justify-center text-[#5C534E]">
      @switch (variant()) {
        @case ('cubiertos') {
          <!-- OPCON A: CUBIERTOS PREMIUM (Geometría Lineal Pura) -->
          <svg [style.width.px]="size() * 0.35" [style.height.px]="size() * 0.35" class="fill-current" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 3h-1c-1.1 0-2 .9-2 2v7c0 .55.45 1 1 1h1v8c0 .55.45 1 1 1s1-.45 1-1V4c0-1.1-.9-2-2-2zM11 3c-.55 0-1 .45-1 1v4c0 .55-.45 1-1 1s-1-.45-1-1V4c0-.55-.45-1-1-1s-1 .45-1 1v4c0 1.3 1.04 2.36 2.33 2.48l-.33 8.52c-.02.55.42 1 .98 1s.99-.45.98-1l-.33-8.52C10.96 10.36 12 9.3 12 8V4c0-.55-.45-1-1-1z"/>
          </svg>
        }
        @case ('campana') {
          <!-- OPCIÓN C: CAMPANA DE SERVICIO (Simetría Cloche) -->
          <svg [style.width.px]="size() * 0.35" [style.height.px]="size() * 0.35" class="fill-current" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5a1 1 0 0 1 1-1h1a1 1 0 0 0 0-2h-4a1 1 0 0 0 0 2h1a1 1 0 0 1 1 1A8 8 0 0 0 4 13v1h16v-1a8 8 0 0 0-8-8zm-8 11h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2z"/>
          </svg>
        }
      }
    </div>
  </div>

  <!-- Texto de Estado Opcional -->
  @if (message()) {
    <span class="text-[#5C534E] text-sm font-semibold tracking-wide mt-1 animate-pulse">
      {{ message() }}
    </span>
  }
</div>
